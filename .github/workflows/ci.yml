# CI caller — the org-standard polyglot workflow for a ts/ + go/ repository.
# Live. Change it here, in a reviewed pull request: session credentials
# can push .github/workflows/* (admin DECISIONS.md ADR-8, as amended
# 2026-09-24). rust.yml runs the Rust gate (ci/rust/run.sh) separately.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # deps names every tabnas repository the ts/ and go/ trees depend on,
  # dependency first. alchemy depends on neither transduce nor render (the
  # maintainer's ruling of 2026-10-08): the tests that run programs on
  # them, and the `tabnas_nodecell` build tag those need, are in
  # tabnas/alchemy-cli, which downstream.yml runs against this checkout.
  ci:
    uses: tabnas/.github/.github/workflows/polyglot-ci.yml@main
    with:
      deps: "parser support debug json"
