[package]
name = "tabnas-alchemy"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "The alchemy grammar plugin and language for the tabnas parsing engine: declarative streaming transducers and renderers."
license = "MIT"
homepage = "https://tabnas.dev"
documentation = "https://docs.rs/tabnas-alchemy"
repository = "https://github.com/tabnas/alchemy"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "stdlib/**"]
keywords = ["parser", "grammar", "dsl", "streaming", "transducer"]
categories = ["parsing", "compilers"]

[lib]
name = "tabnas_alchemy"
path = "src/lib.rs"

[[bin]]
name = "alchemy"
path = "src/bin/alchemy.rs"

[dependencies]
# Sibling checkouts, the standard tabnas development model: the engine
# the grammar plugin installs into, and the two crates the language's
# streams and texts lower to.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
tabnas-transduce = { path = "../../transduce/rs" }
tabnas-render = { path = "../../render/rs" }
# The JSON grammar the binary's `run` parses its input with (already in the
# graph through transduce, which parses JSON Lines with it).
tabnas-json = { path = "../../json/rs" }
indexmap = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader and runner, so test/spec/*.tsv means the same
# thing here as in every other grammar repo.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The introspection plugin, for the debug-model test every grammar carries.
tabnas-debug = { path = "../../debug/rs" }
tabnas-ini = { path = "../../ini/rs" }
tabnas-json5 = { path = "../../json5/rs" }
tabnas-jsonc = { path = "../../jsonc/rs" }
tabnas-jsonic = { path = "../../jsonic/rs" }
tabnas-jsonl = { path = "../../jsonl/rs" }
tabnas-markdown = { path = "../../markdown/rs" }
tabnas-toml = { path = "../../toml/rs" }
tabnas-xml = { path = "../../xml/rs" }
tabnas-yaml = { path = "../../yaml/rs" }
tabnas-csv = { path = "../../csv/rs" }
tabnas-zon = { path = "../../zon/rs" }
