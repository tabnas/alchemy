[package]
name = "tabnas-alchemy"
version = "0.2.3"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "The alchemy grammar plugin and language for the tabnas parsing engine (declarative streaming transducers and renderers), and the types tabnas transducers and renderers share."
license = "MIT"
homepage = "https://tabnas.dev"
documentation = "https://docs.rs/tabnas-alchemy"
repository = "https://github.com/tabnas/alchemy"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "stdlib/**"]
keywords = ["parser", "grammar", "dsl", "streaming", "transducer"]
categories = ["parsing", "compilers"]

[lib]
name = "tabnas_alchemy"
path = "src/lib.rs"

[features]
# The language: the reader (a tabnas grammar plugin), the resolver, the
# checker, the interpreter and the lowering. Without it the crate is the
# `shared` unit alone, the types tabnas-transduce and tabnas-render build
# on, and depends on nothing else in the fleet.
default = ["language"]
language = ["tabnas", "dep:tabnas-json"]
# `Fail::from_tabnas` and `Datum::from_tabnas`, the shared types'
# conversions from the engine's own error and value, for a crate that has
# the engine (tabnas-transduce).
tabnas = ["dep:tabnas"]

[dependencies]
# Sibling checkouts, the standard tabnas development model, both for the
# language alone: the engine the grammar plugin installs into, and the
# JSON grammar the grammar document is read with.
tabnas = { package = "tabnas-parser", path = "../../parser/rs", optional = true }
tabnas-json = { path = "../../json/rs", optional = true }
indexmap = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# No routers and no renderers: tabnas-transduce and tabnas-render depend on
# this crate's shared types, so this crate depends on neither. The tests
# here compile with inert stages (tests/common); the tests that lower and
# run a program are in tabnas-alchemy-cli, which composes all three.
#
# The shared fixture loader and runner, so test/spec/*.tsv means the same
# thing here as in every other grammar repo.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The introspection plugin, for the debug-model test every grammar carries.
tabnas-debug = { path = "../../debug/rs" }
